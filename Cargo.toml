[package]
name = "breeze-editor"
version = "0.1.0"
edition = "2024"
[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[profile.release]
strip = true
opt-level = "s"
